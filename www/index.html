<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101316" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f7f9" media="(prefers-color-scheme: light)">
  <title>Задачи</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="./capacitor.js"></script>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #101316;
      --panel: #171c20;
      --panel-2: #20262b;
      --panel-3: #263039;
      --line: #303941;
      --line-soft: rgba(48, 57, 65, .72);
      --text: #edf2f5;
      --muted: #9aa6af;
      --accent: #6cb6ff;
      --accent-soft: rgba(108, 182, 255, .16);
      --accent-strong: #92c9ff;
      --green: #7ddc8a;
      --yellow: #f4c95d;
      --red: #ff7b72;
      --danger-soft: rgba(255, 123, 114, .14);
      --radius: 8px;
      --control-h: 44px;
      --shadow: 0 18px 44px rgba(0, 0, 0, .28);
      --vvh: 100dvh;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f7f9;
        --panel: #ffffff;
        --panel-2: #edf2f5;
        --panel-3: #e1ebf2;
        --line: #ccd7df;
        --line-soft: rgba(204, 215, 223, .8);
        --text: #151b20;
        --muted: #5f6d78;
        --accent: #1f7fd1;
        --accent-soft: rgba(31, 127, 209, .12);
        --accent-strong: #0b67b8;
        --shadow: 0 16px 38px rgba(29, 47, 61, .14);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: var(--vvh);
      overflow-x: hidden;
    }

    button, input, textarea, select {
      font: inherit;
    }

    .app {
      width: min(100vw, 760px);
      max-width: 100vw;
      min-height: var(--vvh);
      margin: 0 auto;
      overflow: hidden;
      padding: max(14px, env(safe-area-inset-top)) clamp(12px, 4vw, 24px) max(18px, env(safe-area-inset-bottom));
    }

    body.keyboard-open .app {
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    header, .quick, .toolbar, .search, .segments, .stats, .list, .task, .empty {
      max-width: 100%;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: -14px 0 10px;
      padding: max(10px, env(safe-area-inset-top)) 0 10px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      border-bottom: 1px solid var(--line-soft);
      backdrop-filter: blur(10px);
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      width: 100%;
      max-width: 100%;
    }

    .title-row {
      min-width: 0;
    }

    .top-actions {
      display: flex;
      flex-shrink: 0;
      gap: 6px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .quick {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
    }

    .quick-wrap {
      display: grid;
      gap: 5px;
    }

    .quick input, .search input, textarea, select, .field-input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      padding: 8px 11px;
      outline: none;
    }

    .quick input:focus, .search input:focus, textarea:focus, select:focus, .field-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .quick .primary {
      min-height: 40px;
      width: 42px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }

    .quick-preview {
      display: none;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
    }

    .quick-preview.active {
      display: flex;
    }

    .quick-preview-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quick-preview-chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 7px;
      color: var(--accent-strong);
      background: var(--accent-soft);
      line-height: 1.1;
    }

    .icon-btn, .primary, .ghost {
      min-height: var(--control-h);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--panel-2);
      padding: 0 14px;
      cursor: pointer;
    }

    .top-actions .icon-btn {
      width: 44px;
      padding: 0;
    }

    .top-actions svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .bulk-delete {
      background: var(--danger-soft);
      border-color: rgba(255, 123, 114, .5);
      color: var(--red);
      display: none;
    }

    .bulk-delete.active {
      display: grid;
      place-items: center;
    }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #071018;
      font-weight: 700;
    }

    .ghost {
      background: transparent;
      color: var(--muted);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin: 0 0 8px;
      min-width: 0;
    }

    .search {
      display: none;
      min-width: 0;
    }

    .search.active {
      display: block;
    }

    .search-toggle {
      width: 40px;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .segments {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      min-width: 0;
    }

    .segments.main-tabs {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .segments button {
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      min-width: 0;
      overflow: hidden;
      padding: 0 4px;
      text-align: center;
    }

    .main-tabs button {
      font-size: 10px;
    }

    .segments button b {
      display: block;
      color: var(--text);
      font-size: 14px;
      line-height: 1.1;
    }

    .main-tabs button b {
      font-size: 13px;
    }

    .segments button span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .segments button.active {
      background: var(--panel-2);
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--line-soft);
    }

    .list {
      display: grid;
      gap: 6px;
      padding-bottom: 96px;
      min-width: 0;
    }

    .list-heading {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      line-height: 1.2;
      padding: 12px 4px 0;
      text-transform: uppercase;
    }

    .task {
      position: relative;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) 36px;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line-soft);
      border-left: 3px solid transparent;
      border-radius: 12px;
      background: rgba(255, 255, 255, .015);
      padding: 11px 6px 11px 10px;
      box-shadow: none;
      min-width: 0;
      touch-action: manipulation;
      user-select: none;
      cursor: pointer;
    }

    .task.priority-high { border-left-color: var(--red); }
    .task.priority-medium { border-left-color: rgba(244, 201, 93, .7); }
    .task.priority-low { border-left-color: rgba(125, 220, 138, .65); }

    .task.selecting {
      cursor: pointer;
    }

    .task.selected {
      background: var(--accent-soft);
      border-color: rgba(122, 162, 247, .4);
    }

    .check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--bg);
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .task.done .check {
      background: var(--green);
      border-color: var(--green);
    }

    .task.done .title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task.done {
      opacity: .74;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.28;
      overflow-wrap: anywhere;
      margin-bottom: 6px;
    }

    .task-main {
      min-width: 0;
      overflow: hidden;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.25;
    }

    .meta-separator {
      display: none;
    }

    .meta-chip,
    .meta-tag,
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 999px;
      padding: 0 8px;
      color: #d6dde9;
      background: rgba(255, 255, 255, .03);
      font-size: 11.5px;
      line-height: 1.2;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button.pill {
      background: transparent;
      cursor: pointer;
      font: inherit;
    }

    .pill.high { color: var(--red); border-color: rgba(255, 123, 114, .45); }
    .pill.medium { color: var(--yellow); border-color: rgba(244, 201, 93, .45); }
    .pill.low { color: var(--green); border-color: rgba(125, 220, 138, .45); }
    .pill.overdue { color: var(--red); }
    .pill.today { color: var(--accent); }
    .pill.no-due { color: var(--muted); border-style: dashed; }

    .meta-link {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, .07);
      background: rgba(255, 255, 255, .03);
      color: #d6dde9;
      cursor: pointer;
      font: inherit;
      line-height: inherit;
      padding: 0 8px;
      min-height: 22px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta-link.overdue {
      color: var(--red);
      border-color: rgba(255, 123, 114, .28);
      background: rgba(255, 123, 114, .08);
    }

    .meta-link.today {
      color: var(--accent-strong);
      border-color: rgba(122, 162, 247, .24);
      background: rgba(122, 162, 247, .1);
    }

    .meta-link.no-due {
      color: var(--muted);
      border-style: dashed;
      background: transparent;
    }

    .meta-tag.priority-high {
      color: #ffb0a6;
      border-color: rgba(255, 123, 114, .28);
      background: rgba(255, 123, 114, .08);
    }

    .meta-tag.priority-low {
      color: #a7dfae;
      border-color: rgba(125, 220, 138, .24);
      background: rgba(125, 220, 138, .08);
    }

    .menu {
      display: grid;
      gap: 6px;
    }

    .mini {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 50%;
      background: rgba(255, 255, 255, .02);
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
    }

    .mini:active,
    .mini:hover {
      background: var(--panel-2);
      color: var(--text);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 42px 18px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    dialog {
      width: min(560px, calc(100% - 20px));
      max-height: min(760px, calc(var(--vvh) - 20px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      padding: 0;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, .62);
    }

    .action-dialog {
      width: min(520px, calc(100% - 18px));
      margin: auto auto max(10px, env(safe-area-inset-bottom));
      border-radius: 14px 14px var(--radius) var(--radius);
    }

    .action-dialog.manage-dialog {
      width: min(360px, calc(100% - 28px));
    }

    .action-dialog.manage-dialog .action-sheet {
      gap: 8px;
      padding: 12px;
    }

    .action-dialog.manage-dialog .action-sheet-title {
      font-size: 17px;
      line-height: 1.18;
    }

    .action-dialog.manage-dialog .action-sheet-meta {
      font-size: 12px;
    }

    .action-sheet {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .action-sheet-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      padding: 2px 2px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
      min-width: 0;
      align-items: start;
    }

    .action-sheet-head.has-back {
      grid-template-columns: 36px minmax(0, 1fr);
    }

    .sheet-back {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 999px;
      display: none;
      place-items: center;
    }

    .sheet-back.active {
      display: grid;
    }

    .sheet-back svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .action-sheet-copy {
      min-width: 0;
    }

    .action-sheet-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.12;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .action-sheet-meta {
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.35;
      margin-top: 4px;
    }

    .sheet-actions {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
    }

    .sheet-actions button {
      width: 100%;
      min-height: 46px;
      border-radius: 13px;
      font-size: 14px;
      font-weight: 600;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
    }

    .sheet-actions .primary {
      grid-column: 1 / -1;
      min-height: 52px;
      justify-content: center;
    }

    .sheet-actions .wide {
      grid-column: 1 / -1;
    }

    .sheet-actions .ghost {
      background: rgba(255, 255, 255, .02);
      border-color: rgba(255, 255, 255, .08);
      color: #d9e1ee;
    }

    .sheet-actions .danger {
      grid-column: 1 / -1;
      color: #ff8c86;
      border-color: rgba(255, 123, 114, .35);
      background: rgba(255, 123, 114, .06);
      justify-content: center;
    }

    .sheet-actions .danger:hover {
      background: rgba(255, 123, 114, .1);
    }

    .sheet-actions.compact {
      grid-template-columns: 1fr;
    }

    .sheet-actions.compact .primary {
      grid-column: auto;
      min-height: 46px;
    }

    .sheet-actions.compact button {
      justify-content: center;
      text-align: center;
    }

    .action-dialog.manage-dialog .sheet-actions.compact button {
      min-height: 42px;
    }

    .action-dialog.manage-dialog .sheet-actions .primary {
      min-height: 46px;
    }

    .modal.schedule-only .modal-head,
    .modal.schedule-only .field-block.text-field,
    .modal.schedule-only .form-grid {
      display: none;
    }

    .modal {
      padding: 0;
      display: grid;
      gap: 0;
      max-height: inherit;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 2;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border-bottom: 1px solid var(--line-soft);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 10px;
    }

    .modal h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    textarea {
      min-height: 62px;
      resize: vertical;
    }

    .field-block {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .modal > .field-block,
    .form-grid,
    .time-panel {
      margin: 0 14px;
    }

    .modal > .field-block {
      padding-top: 10px;
    }

    .field-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      padding-left: 2px;
    }

    .field-input {
      appearance: none;
      -webkit-appearance: none;
      font-size: 16px;
    }

    .field-input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .choice-grid {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 1px 1px 4px;
      scrollbar-width: none;
    }

    .choice-grid::-webkit-scrollbar {
      display: none;
    }

    .choice-btn {
      flex: 0 0 auto;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      padding: 0 13px;
      white-space: nowrap;
    }

    .choice-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding-top: 8px;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .time-panel {
      border-top: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      display: grid;
      gap: 8px;
      padding: 10px 0;
      margin-top: 8px;
    }

    .time-panel-head,
    .all-day-control,
    .calendar-nav,
    .time-summary {
      align-items: center;
      display: flex;
      gap: 10px;
    }

    .time-panel-head {
      justify-content: space-between;
      font-weight: 700;
      font-size: 15px;
    }

    .all-day-control {
      color: var(--muted);
      cursor: pointer;
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 500;
      gap: 8px;
      min-height: 30px;
    }

    .time-panel-title {
      align-items: center;
      display: flex;
      gap: 10px;
      min-width: 0;
    }

    .time-icon {
      color: var(--muted);
      display: grid;
      place-items: center;
      width: 26px;
    }

    .calendar-toggle {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--accent-strong);
      cursor: pointer;
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 12px;
      font-size: 12px;
    }

    .calendar-toggle::after {
      content: "↓";
      display: inline-block;
      margin-left: 6px;
      transition: transform .16s ease;
    }

    .time-panel.calendar-open .calendar-toggle::after {
      transform: rotate(180deg);
    }

    .calendar-section {
      display: none;
      gap: 8px;
    }

    .time-panel.calendar-open .calendar-section {
      display: grid;
    }



    .switch {
      position: relative;
      width: 42px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      position: absolute;
    }

    .switch span {
      background: var(--panel-3);
      border-radius: 999px;
      inset: 0;
      position: absolute;
      transition: background .18s ease;
    }

    .switch span::after {
      background: var(--text);
      border-radius: 50%;
      content: "";
      height: 20px;
      left: 3px;
      position: absolute;
      top: 3px;
      transition: transform .18s ease;
      width: 20px;
    }

    .switch input:checked + span {
      background: var(--accent);
    }

    .switch input:checked + span::after {
      transform: translateX(16px);
    }

    .time-summary {
      justify-content: stretch;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(78px, auto) auto;
    }

    .date-chip,
    .preset-chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      cursor: pointer;
      min-height: 34px;
      padding: 0 14px;
      font-weight: 700;
    }

    .time-separator {
      color: var(--muted);
      font-weight: 700;
    }

    .time-value {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: 0;
      color: var(--accent-strong);
      font-size: 17px;
      min-height: 34px;
      outline: none;
      text-align: center;
      width: 78px;
      padding: 0;
    }

    .time-value.empty,
    .time-value:disabled {
      color: var(--muted);
      opacity: .55;
    }

    .calendar-nav {
      justify-content: space-between;
      padding: 0 2px;
    }

    .month-label {
      color: var(--text);
      font-size: 15px;
    }

    .calendar-arrow {
      background: transparent;
      border: 0;
      color: var(--text);
      cursor: pointer;
      font-size: 24px;
      height: 32px;
      width: 32px;
    }

    .weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      text-align: center;
    }

    .weekdays {
      color: var(--muted);
      font-size: 11px;
      padding: 0 2px;
    }

    .weekdays span {
      padding: 4px 0;
    }

    .weekday-sunday,
    .calendar-day.sunday {
      color: var(--red);
    }

    .calendar-grid {
      row-gap: 2px;
    }

    .calendar-day {
      background: transparent;
      border: 0;
      color: var(--text);
      cursor: pointer;
      height: 31px;
      margin: 0 auto;
      padding: 0;
      width: 31px;
      border-radius: 50%;
    }

    .calendar-day.muted {
      color: rgba(155, 167, 176, .38);
    }

    .calendar-day.selected {
      background: var(--accent);
      color: #071018;
      font-weight: 700;
    }

    .preset-row {
      display: grid;
      gap: 6px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 2px 0 0;
    }

    .preset-chip {
      background: transparent;
      color: var(--text);
      font-weight: 400;
      min-height: 32px;
      padding: 0 8px;
      white-space: nowrap;
      font-size: 12px;
    }

    .actions {
      position: sticky;
      bottom: 0;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border-top: 1px solid var(--line-soft);
      backdrop-filter: blur(10px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 0;
      padding: 10px 14px max(10px, env(safe-area-inset-bottom));
    }

    #deleteBtn {
      margin: 0 14px 12px;
    }

    body.keyboard-open dialog {
      max-height: calc(var(--vvh) - 10px);
      margin: 6px auto auto;
    }

    body.keyboard-open #taskDialog {
      width: calc(100% - 12px);
      max-height: calc(var(--vvh) - 8px);
    }

    body.keyboard-open .modal {
      gap: 6px;
    }

    body.keyboard-open .modal-head {
      padding-top: 10px;
      padding-bottom: 8px;
    }

    body.keyboard-open .field-block.text-field {
      padding-top: 8px;
    }

    body.keyboard-open textarea {
      min-height: 54px;
    }

    body.keyboard-open .time-panel {
      gap: 7px;
      padding: 8px 0;
      margin-top: 4px;
    }

    body.keyboard-open .actions {
      position: static;
      padding-top: 8px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }

    @media (max-width: 640px) {
      #taskDialog {
        width: calc(100% - 16px);
        max-height: min(640px, calc(var(--vvh) - 24px));
        margin: auto auto max(8px, env(safe-area-inset-bottom));
        border-radius: 14px 14px var(--radius) var(--radius);
      }

      #taskForm {
        max-height: inherit;
      }
    }

    .danger {
      color: var(--red);
      border-color: rgba(255, 123, 114, .45);
    }

    .settings-grid {
      display: grid;
      gap: 8px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: var(--panel-2);
    }

    .settings-row span {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .settings-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .time-picker-dialog {
      width: min(360px, calc(100% - 24px));
      margin: auto auto max(10px, env(safe-area-inset-bottom));
    }

    .time-picker {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .time-picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .time-picker-head h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .time-picker-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .time-wheel-wrap {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 4px 0;
    }

    .time-wheel-wrap::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 42px;
      transform: translateY(-50%);
      border-top: 1px solid rgba(255, 255, 255, .08);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      background: rgba(255, 255, 255, .02);
      border-radius: 12px;
      pointer-events: none;
    }

    .time-wheel {
      position: relative;
      height: 168px;
      overflow-y: auto;
      scrollbar-width: none;
      scroll-snap-type: y mandatory;
      overscroll-behavior: contain;
      padding: 63px 0;
      -webkit-overflow-scrolling: touch;
    }

    .time-wheel::-webkit-scrollbar {
      display: none;
    }

    .time-wheel button {
      width: 100%;
      min-height: 42px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      font-weight: 600;
      scroll-snap-align: center;
      padding: 0;
    }

    .time-wheel button.active {
      color: var(--text);
    }

    .time-wheel-separator {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font-size: 28px;
      font-weight: 700;
    }

    .time-picker-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .status-text {
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .hidden-file {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 520px) {
      .quick, .toolbar, .search, .segments, .stats, .list, .empty {
        width: 100%;
      }

      .top {
        width: 100%;
      }

      dialog {
        width: calc(100% - 24px);
      }

      .choice-grid.priority {
        grid-template-columns: 1fr;
      }

        gap: 10px;
        padding: 12px;
      }

        line-height: 1.15;
      }

      .action-sheet-meta {
        font-size: 12px;
      }

      .sheet-actions {
        gap: 8px;
      }

      .sheet-actions button {

        font-size: 13.5px;
      }

      .sheet-actions .primary {
        min-height: 48px;
      }

      .preset-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-height: 760px) {
      textarea {
        min-height: 62px;
      }

      .modal {
        gap: 8px;
      }

      .time-panel {
        gap: 7px;
        padding: 8px 0;
      }

      .calendar-day {
        height: 32px;
        width: 32px;
      }

      .weekdays span {
        padding: 4px 0;
      }

      .preset-chip {
        min-height: 34px;
      }
    }

    @media (min-width: 680px) {
      .app {
        width: min(100vw, 920px);
      }

      .list {
        gap: 10px;
      }

      dialog {
        width: min(560px, calc(100% - 48px));
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="top">
        <div class="title-row">
          <h1>Задачи</h1>
          <div class="count" id="countText">0 на сегодня</div>

        <div class="top-actions">

            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M6 6l1 18h10l1-18"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
          </button>
          <button class="search-toggle" id="searchToggle" type="button" aria-label="Поиск">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M16.5 16.5L21 21"></path>
            </svg>
          </button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="Настройки">⚙</button>
        </div>
      </div>

      <div class="quick-wrap">
        <form class="quick" id="quickForm">
          <input id="quickInput" autocomplete="off" placeholder="Купить молоко завтра 18:00 важно">
          <button class="primary" type="submit" aria-label="Добавить">+</button>
        </form>
        <div class="quick-preview" id="quickPreview" aria-live="polite"></div>
      </div>
    </header>

    <section class="toolbar">
      <div class="search" id="searchWrap">
        <input id="searchInput" autocomplete="off" placeholder="Поиск">
      </div>
      <div class="segments main-tabs" role="tablist">
        <button data-filter="today" class="active" type="button">
          <b id="filterTodayCount">0</b>
          <span>Сегодня</span>
        </button>
        <button data-filter="inbox" type="button">
          <b id="filterInboxCount">0</b>
          <span>Бессрочные</span>
        </button>
        <button data-filter="upcoming" type="button">
          <b id="filterUpcomingCount">0</b>
          <span>Будущие</span>
        </button>
        <button data-filter="done" type="button">
          <b id="filterDoneCount">0</b>
          <span>Закрытые</span>
        </button>
      </div>
    </section>

    <section class="list" id="taskList"></section>
  </main>

  <dialog id="taskDialog">
    <form class="modal" id="taskForm" method="dialog">
      <div class="modal-head">
        <h2 id="dialogTitle">Новая задача</h2>
      </div>
      <label class="field-block text-field">
        <span class="field-label">Описание</span>
        <textarea id="taskText" placeholder="Что нужно сделать?"></textarea>
      </label>
      <div class="form-grid">
        <div class="field-block">
          <span class="field-label">Тип</span>
          <input id="taskType" type="hidden" value="task">
          <div class="choice-grid" data-choice-field="type">
            <button class="choice-btn" data-choice-value="task" type="button">Задача</button>
            <button class="choice-btn" data-choice-value="reminder" type="button">Напоминание</button>
          </div>
        </div>
        <div class="field-block">
          <span class="field-label">Важность</span>
          <input id="taskPriority" type="hidden" value="medium">
          <div class="choice-grid priority" data-choice-field="priority">
            <button class="choice-btn" data-choice-value="medium" type="button">Средне</button>
            <button class="choice-btn" data-choice-value="high" type="button">Важно</button>
            <button class="choice-btn" data-choice-value="low" type="button">Низко</button>
          </div>
        </div>
        <div class="field-block">
          <span class="field-label">Повтор</span>
          <input id="taskRepeat" type="hidden" value="none">
          <div class="choice-grid repeat" data-choice-field="repeat">
            <button class="choice-btn" data-choice-value="none" type="button">Нет</button>
            <button class="choice-btn" data-choice-value="daily" type="button">Каждый день</button>
            <button class="choice-btn" data-choice-value="weekdays" type="button">Будни</button>
            <button class="choice-btn" data-choice-value="weekly" type="button">Неделя</button>
            <button class="choice-btn" data-choice-value="monthly" type="button">Месяц</button>
            <button class="choice-btn" data-choice-value="interval" type="button">N дней</button>
          </div>
          <input class="field-input" id="taskRepeatEveryDays" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="Каждые сколько дней">
        </div>
      </div>
      <div class="time-panel">
        <div class="time-panel-head">
          <span class="time-panel-title">
            <span class="time-icon">◷</span>
            <span>Дата и время</span>
          </span>
          <label class="all-day-control">
            <span>Весь день</span>
            <span class="switch">
              <input id="allDayToggle" type="checkbox">
              <span></span>
            </span>
          </label>
        </div>
        <div class="time-summary">
          <button class="date-chip" id="todayBtn" type="button">Сегодня</button>
          <span class="time-separator">|</span>
          <button class="time-value empty" id="timePickerBtn" type="button" aria-label="Время">--:--</button>
          <input id="taskTime" type="hidden">
          <button class="calendar-toggle" id="calendarToggleBtn" type="button" aria-expanded="false">Календарь</button>
        </div>
        <div class="calendar-section" id="calendarSection">
          <div class="calendar-nav">
            <button class="calendar-arrow" id="prevMonthBtn" type="button" aria-label="Предыдущий месяц">‹</button>
            <div class="month-label" id="monthLabel">июнь 2026 г.</div>
            <button class="calendar-arrow" id="nextMonthBtn" type="button" aria-label="Следующий месяц">›</button>
          </div>
          <div class="weekdays" aria-hidden="true">
            <span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span class="weekday-sunday">ВС</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
          <input id="taskDue" type="hidden">
          <div class="preset-row">
            <button class="preset-chip" data-date-preset="1" type="button">Завтра</button>
            <button class="preset-chip" data-date-preset="3" type="button">Через 3 дня</button>
            <button class="preset-chip" data-date-preset="7" type="button">Через 1 неделю</button>
            <button class="preset-chip" id="clearDueBtn" type="button">Без срока</button>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="ghost" value="cancel" type="button" id="cancelBtn">Отмена</button>
        <button class="primary" value="default" type="submit">Сохранить</button>
      </div>
      <button class="ghost danger" type="button" id="deleteBtn">Удалить</button>
    </form>
  </dialog>

  <dialog class="action-dialog" id="actionDialog">
    <form class="action-sheet" method="dialog">
      <div class="action-sheet-head">
        <button class="ghost sheet-back" id="sheetBackBtn" type="button" aria-label="Назад" title="Назад">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"></path>
          </svg>
        </button>
        <div class="action-sheet-copy">
          <div class="action-sheet-title" id="actionTitle">Задача</div>
          <div class="action-sheet-meta" id="actionMeta">Действия</div>
        </div>
      </div>
      <div class="sheet-actions" id="sheetActions"></div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form class="modal" method="dialog">
      <h2>Настройки</h2>
      <div class="settings-grid" aria-label="Состояние">
        <div class="settings-row"><b>Telegram</b><span id="telegramStatus">проверка</span></div>
        <div class="settings-row"><b>Задачи на сервере</b><span id="serverTaskCount">проверка</span></div>
        <div class="settings-row"><b>Часовой пояс</b><span id="timezoneStatus">проверка</span></div>
      </div>
      <div class="settings-actions">
        <button class="primary" type="button" id="testTelegramBtn">Тест Telegram</button>
        <button class="ghost" type="button" id="exportBtn">Экспорт задач</button>
        <button class="ghost" type="button" id="importBtn">Импорт задач</button>
        <input class="hidden-file" id="importFile" type="file" accept="application/json,.json">
      </div>
      <div class="status-text" id="settingsMessage"></div>
      <button class="ghost" value="cancel" type="button" id="settingsCloseBtn">Закрыть</button>
    </form>
  </dialog>

  <dialog class="time-picker-dialog" id="timePickerDialog">
    <form class="time-picker" method="dialog">
      <div class="time-picker-head">
        <div>
          <h3>Время</h3>
          <div class="time-picker-meta">Скролл для выбора</div>
        </div>
      </div>
      <div class="time-wheel-wrap">
        <div class="time-wheel" id="hourWheel" aria-label="Часы"></div>
        <div class="time-wheel-separator">:</div>
        <div class="time-wheel" id="minuteWheel" aria-label="Минуты"></div>
      </div>
      <div class="time-picker-actions">
        <button class="ghost" id="timePickerCancelBtn" type="button">Отмена</button>
        <button class="primary" id="timePickerApplyBtn" type="button">Выбрать</button>
      </div>
    </form>
  </dialog>

  <script>
    const storeKey = "anton.mobile.tasks.v1";
    const nativeApp = Boolean(window.Capacitor?.isNativePlatform?.());
    const serverBase = nativeApp ? "http://192.168.100.25:8787" : "";
    const apiUrl = serverBase ? `${serverBase}/api/tasks` : "./api/tasks";
    const statusUrl = serverBase ? `${serverBase}/api/status` : "./api/status";
    const testReminderUrl = serverBase ? `${serverBase}/api/test-reminder` : "./api/test-reminder";
    const filters = document.querySelectorAll("[data-filter]");
    const list = document.querySelector("#taskList");
    const dialog = document.querySelector("#taskDialog");
    const actionDialog = document.querySelector("#actionDialog");
    const timePickerDialog = document.querySelector("#timePickerDialog");
    const sheetBackBtn = document.querySelector("#sheetBackBtn");
    const sheetActions = document.querySelector("#sheetActions");
    const settingsDialog = document.querySelector("#settingsDialog");
    const timePickerBtn = document.querySelector("#timePickerBtn");
    const hourWheel = document.querySelector("#hourWheel");
    const minuteWheel = document.querySelector("#minuteWheel");
    const form = document.querySelector("#taskForm");
    const quickForm = document.querySelector("#quickForm");
    const quickInput = document.querySelector("#quickInput");
    const quickPreview = document.querySelector("#quickPreview");
    const searchWrap = document.querySelector("#searchWrap");
    const searchToggle = document.querySelector("#searchToggle");
    const searchInput = document.querySelector("#searchInput");
    const bulkDeleteBtn = document.querySelector("#bulkDeleteBtn");
    const settingsMessage = document.querySelector("#settingsMessage");
    const calendarGrid = document.querySelector("#calendarGrid");
    const monthLabel = document.querySelector("#monthLabel");
    const allDayToggle = document.querySelector("#allDayToggle");
    const timePanel = document.querySelector(".time-panel");
    const calendarToggleBtn = document.querySelector("#calendarToggleBtn");
    const fields = {
      text: document.querySelector("#taskText"),
      type: document.querySelector("#taskType"),
      priority: document.querySelector("#taskPriority"),
      repeat: document.querySelector("#taskRepeat"),
      repeatIntervalDays: document.querySelector("#taskRepeatEveryDays"),
      due: document.querySelector("#taskDue"),
      time: document.querySelector("#taskTime"),
    };
    let tasks = [];
    let currentFilter = "today";
    let editingId = null;
    let actionTaskId = null;
    let actionSheetParentId = null;
    let dialogMode = "full";
    let timePickerHour = "12";
    let timePickerMinute = "00";
    const selectedTaskIds = new Set();
    let selectionMode = false;
    let longPressTimer = null;
    let suppressNextTaskClick = false;
    let calendarViewDate = new Date();

    function setCalendarOpen(open) {
      timePanel.classList.toggle("calendar-open", open);
      calendarToggleBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function loadLocal() {
      try {
        return JSON.parse(localStorage.getItem(storeKey) || "[]");
      } catch {
        return [];
      }
    }

    async function load() {
      try {
        const res = await fetch(apiUrl, { cache: "no-store" });
        if (!res.ok) throw new Error("load failed");
        tasks = await res.json();
        tasks = tasks.map(normalizeTaskTime);
        const local = loadLocal();
        if (!tasks.length && local.length) {
          tasks = local.map(normalizeTaskTime);
          await persistAll();
        }
      } catch {
        tasks = loadLocal().map(normalizeTaskTime);
      }
      render();
      await syncLocalNotifications();
    }

    function saveLocal() {
      localStorage.setItem(storeKey, JSON.stringify(tasks));
    }

    async function persistAll() {
      saveLocal();
      try {
        await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(tasks)
        });
      } catch {
        // Offline/local fallback is still kept in localStorage.
      }
    }

    async function createTask(task) {
      saveLocal();
      try {
        const res = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(task)
        });
        if (!res.ok) throw new Error("create failed");
      } catch {
        // Offline/local fallback is still kept in localStorage.
      }
    }

    async function updateTask(task) {
      saveLocal();
      try {
        const res = await fetch(`${apiUrl}/${encodeURIComponent(task.id)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(task)
        });
        if (!res.ok) throw new Error("update failed");
      } catch {
        // Offline/local fallback is still kept in localStorage.
      }
    }

    async function deleteTaskById(id) {
      saveLocal();
      try {
        const res = await fetch(`${apiUrl}/${encodeURIComponent(id)}`, { method: "DELETE" });
        if (!res.ok) throw new Error("delete failed");
      } catch {
        // Offline/local fallback is still kept in localStorage.
      }
    }

    function localIsoDate(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function dateFromIso(value) {
      const parts = (value || "").split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function addMinutes(date, minutes) {
      const next = new Date(date);
      next.setMinutes(next.getMinutes() + minutes, 0, 0);
      return next;
    }

    function dueAtUtc(due, time) {
      if (!due || !time) return "";
      const date = new Date(`${due}T${time}:00`);
      return Number.isNaN(date.getTime()) ? "" : date.toISOString();
    }

    function localTime(date = new Date()) {
      return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function localNotificationsPlugin() {
      return window.Capacitor?.Plugins?.LocalNotifications || window.CapacitorCustomPlatform?.plugins?.LocalNotifications || null;
    }

    function notificationId(taskId) {
      let hash = 0;
      for (let i = 0; i < String(taskId).length; i += 1) {
        hash = ((hash << 5) - hash + String(taskId).charCodeAt(i)) | 0;
      }
      return Math.abs(hash) % 2147483647 || 1;
    }

    async function ensureNotificationPermission(plugin) {
      if (!plugin?.requestPermissions) return false;
      const current = plugin.checkPermissions ? await plugin.checkPermissions() : {};
      if (current.display === "granted") return true;
      const requested = await plugin.requestPermissions();
      return requested.display === "granted";
    }

    async function cancelLocalNotification(task) {
      const plugin = localNotificationsPlugin();
      if (!plugin?.cancel || !task?.id) return;
      try {
        await plugin.cancel({ notifications: [{ id: notificationId(task.id) }] });
      } catch {
        // Native notifications are best-effort; task data is still saved.
      }
    }

    async function scheduleLocalNotification(task) {
      const plugin = localNotificationsPlugin();
      if (!plugin?.schedule || !task?.id) return;
      await cancelLocalNotification(task);
      if (task.done || !task.due || !task.time) return;
      const when = new Date(`${task.due}T${task.time}:00`);
      if (Number.isNaN(when.getTime()) || when <= new Date()) return;
      try {
        if (!(await ensureNotificationPermission(plugin))) return;
        await plugin.schedule({
          notifications: [{
            id: notificationId(task.id),
            title: typeLabel(task.type) === "напоминание" ? "Напоминание" : "Задача",
            body: task.text || "Напоминание",
            schedule: { at: when }
          }]
        });
      } catch {
        // The app remains usable even if Android blocks exact alarms/notifications.
      }
    }

    async function syncLocalNotifications() {
      const plugin = localNotificationsPlugin();
      if (!plugin?.schedule) return;
      for (const task of tasks) {
        await scheduleLocalNotification(task);
      }
    }

    function browserTimeZone() {
      return Intl.DateTimeFormat().resolvedOptions().timeZone || "local";
    }

    function normalizeTaskTime(task) {
      const due = task.due || "";
      const time = task.time || "";
      return {
        ...task,
        project: normalizeProject(task.project),
        time,
        notifiedAt: task.notifiedAt || "",
        dueAtUtc: task.dueAtUtc || dueAtUtc(due, time),
        repeat: normalizeRepeat(task.repeat),
        repeatIntervalDays: normalizeRepeat(task.repeat) === "interval"
          ? normalizeRepeatIntervalDays(task.repeatIntervalDays)
          : null,
        repeatAnchorDay: normalizeRepeat(task.repeat) === "monthly"
          ? normalizeRepeatAnchorDay(task.repeatAnchorDay, due)
          : null,
        sourceTimeZone: task.sourceTimeZone || browserTimeZone(),
        sourceOffsetMinutes: Number.isFinite(task.sourceOffsetMinutes)
          ? task.sourceOffsetMinutes
          : -new Date().getTimezoneOffset()
      };
    }

    function todayIso() {
      return localIsoDate();
    }

    function makeTask(text) {
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        text: text.trim(),
        type: "task",
        priority: "medium",
        project: "Напоминалка",
        due: "",
        time: "",
        dueAtUtc: "",
        repeat: "none",
        repeatIntervalDays: null,
        sourceTimeZone: browserTimeZone(),
        sourceOffsetMinutes: -new Date().getTimezoneOffset(),
        notifiedAt: "",
        done: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function typeLabel(type) {
      return {
        task: "задача",
        reminder: "напоминание",
        waiting: "жду",
        decision: "решение"
      }[type] || type;
    }

    function priorityLabel(priority) {
      return {
        high: "важно",
        medium: "средне",
        low: "низко"
      }[priority] || priority;
    }

    function normalizeRepeat(repeat) {
      return ["daily", "weekdays", "weekly", "monthly", "interval"].includes(repeat) ? repeat : "none";
    }

    function normalizeRepeatIntervalDays(value) {
      const numeric = Number(value);
      if (!Number.isInteger(numeric)) return 2;
      return Math.min(Math.max(numeric, 1), 365);
    }

    function repeatLabel(repeat, intervalDays) {
      const normalized = normalizeRepeat(repeat);
      if (normalized === "interval") {
        return `каждые ${normalizeRepeatIntervalDays(intervalDays)} дн.`;
      }
      return {
        daily: "каждый день",
        weekdays: "будни",
        weekly: "еженедельно",
        monthly: "ежемесячно"
      }[normalized] || "";
    }

    function normalizeRepeatAnchorDay(value, due) {
      const numeric = Number(value);
      if (Number.isInteger(numeric) && numeric >= 1 && numeric <= 31) return numeric;
      const dueDate = dateFromIso(due);
      return dueDate ? dueDate.getDate() : null;
    }

    function dueLabel(due, time) {
      if (!due) return "";
      const parts = due.split("-");
      const label = parts.length === 3 ? `${parts[2]}.${parts[1]}` : due;
      return time ? `${label} ${time}` : label;
    }

    function taskActionMeta(task) {
      const parts = [];
      const due = dueLabel(task.due, task.time);
      if (due) parts.push(due);
      if (task.type) parts.push(typeLabel(task.type));
      if (task.priority && task.priority !== "medium") parts.push(priorityLabel(task.priority));
      return parts.join(" • ") || "Быстрые действия";
    }

    function setActionDialogMode(mode = "quick") {
      actionDialog.classList.toggle("manage-dialog", mode === "manage");
    }

    function shortDateText(value) {
      const today = localIsoDate();
      if (value === today) return "Сегодня";
      if (value === localIsoDate(addDays(new Date(), 1))) return "Завтра";
      const parts = (value || "").split("-");
      return parts.length === 3 ? `${parts[2]}.${parts[1]}` : "Дата";
    }

    function isoToDisplayDate(value) {
      const parts = (value || "").split("-");
      return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : "";
    }

    function displayDateToIso(value) {
      const match = (value || "").trim().match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
      if (!match) return "";
      return `${match[3]}-${match[2]}-${match[1]}`;
    }

    function formatDateInput(value) {
      const digits = value.replace(/\D/g, "").slice(0, 8);
      const day = digits.slice(0, 2);
      const month = digits.slice(2, 4);
      const year = digits.slice(4, 8);
      return [day, month, year].filter(Boolean).join(".");
    }

    function formatTimeInput(value) {
      const digits = value.replace(/\D/g, "").slice(0, 4);
      const hours = digits.slice(0, 2);

    function updateTimeButton() {

    function buildTimeWheel(container, total, onSelect) {
      container.innerHTML = "";
      for (let i = 0; i < total; i += 1) {
        const value = String(i).padStart(2, "0");
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.value = value;
        button.textContent = value;

    function markTimeWheelActive(container, value) {

    function scrollTimeWheelToValue(container, value, instant = false) {
      const target = container.querySelector(`button[data-value="${value}"]`);
      if (!target) return;
      target.scrollIntoView({ block: "center", behavior: instant ? "auto" : "smooth" });
      markTimeWheelActive(container, value);
    }

    function setTimePickerHour(value, instant = false) {
      timePickerHour = value;
      scrollTimeWheelToValue(hourWheel, value, instant);
    }

    function setTimePickerMinute(value, instant = false) {
      timePickerMinute = value;
      scrollTimeWheelToValue(minuteWheel, value, instant);
    }

    function snapTimeWheel(container, fallback, setter) {
      const itemHeight = 42;
      const centered = Math.round(container.scrollTop / itemHeight);
      const maxIndex = container.children.length - 1;
      const index = Math.min(Math.max(centered, 0), maxIndex);
      const value = container.children[index]?.dataset.value || fallback;
      setter(value, false);
    }

    function openTimePicker() {
      if (allDayToggle.checked) return;
      const value = normalizedTime(fields.time.value) || defaultReminderTime();
      const [hours, minutes] = value.split(":");
      setTimePickerHour(hours, true);
      setTimePickerMinute(minutes, true);
      timePickerDialog.showModal();
    }

    function applyTimePicker() {
      fields.time.value = `${timePickerHour}:${timePickerMinute}`;
      updateTimeButton();
      timePickerDialog.close();
    }

    function defaultReminderTime() {
      const date = new Date();
      date.setMinutes(date.getMinutes() + 30);
      const minutes = date.getMinutes();
      date.setMinutes(minutes <= 30 ? 30 : 0, 0, 0);
      if (minutes > 30) date.setHours(date.getHours() + 1);
      return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function normalizedTime(value) {
      return /^\d{2}:\d{2}$/.test(value || "") ? value : "";
    }

    function addMonthsClamped(date, months, anchorDay = date.getDate()) {
      const next = new Date(date.getFullYear(), date.getMonth() + months, 1);
      const lastDay = new Date(next.getFullYear(), next.getMonth() + 1, 0).getDate();
      next.setDate(Math.min(anchorDay, lastDay));
      return next;
    }

    function isFutureOccurrence(date, time) {
      const iso = localIsoDate(date);
      if (!time) return iso > todayIso();
      const dueAt = new Date(`${iso}T${time}:00`);
      return !Number.isNaN(dueAt.getTime()) && dueAt > new Date();
    }

    function nextRepeatDue(task) {
      const repeat = normalizeRepeat(task.repeat);
      if (repeat === "none" || !task.due) return "";
      let next = dateFromIso(task.due);
      if (!next) return "";
      for (let i = 0; i < 370; i += 1) {
        if (repeat === "daily") {
          next = addDays(next, 1);
        } else if (repeat === "weekdays") {
          do {
            next = addDays(next, 1);
          } while (next.getDay() === 0 || next.getDay() === 6);
        } else if (repeat === "weekly") {
          next = addDays(next, 7);
        } else if (repeat === "monthly") {
          next = addMonthsClamped(next, 1, normalizeRepeatAnchorDay(task.repeatAnchorDay, task.due));
        } else if (repeat === "interval") {
          next = addDays(next, normalizeRepeatIntervalDays(task.repeatIntervalDays));
        }
        if (isFutureOccurrence(next, task.time)) return localIsoDate(next);
      }
      return "";
    }

    function parseQuickTask(rawText) {
      let text = (rawText || "").trim();
      const parsed = {
        text,
        type: "task",
        priority: "medium",
        due: "",
        time: "",
        dueAtUtc: "",
        repeat: "none",
        repeatIntervalDays: null,
        sourceTimeZone: browserTimeZone(),
        sourceOffsetMinutes: -new Date().getTimezoneOffset()
      };

      function consume(regex, handler) {
        text = text.replace(regex, (...args) => {
          handler?.(...args);
          return " ";
        });
      }

      consume(/(?<![\p{L}\p{N}_])(срочно|важно|важная|важный|важное)(?![\p{L}\p{N}_])/giu, () => {
        parsed.priority = "high";
      });
      consume(/(?<![\p{L}\p{N}_])(низко|низкая|низкий|низкое|неважно)(?![\p{L}\p{N}_])/giu, () => {
        parsed.priority = "low";
      });
      consume(/(?<![\p{L}\p{N}_])(средне|средняя|средний|среднее)(?![\p{L}\p{N}_])/giu, () => {
        parsed.priority = "medium";
      });
      consume(/(?<![\p{L}\p{N}_])(напомни|напоминание|напоминалка)(?![\p{L}\p{N}_])/giu, () => {
        parsed.type = "reminder";
      });
      consume(/(?<![\p{L}\p{N}_])задача(?![\p{L}\p{N}_])/giu, () => {
        parsed.type = "task";
      });
      consume(/(?<![\p{L}\p{N}_])(каждый\s+день|ежедневно)(?![\p{L}\p{N}_])/giu, () => {
        parsed.repeat = "daily";
      });
      consume(/(?<![\p{L}\p{N}_])(по\s+будням|будни)(?![\p{L}\p{N}_])/giu, () => {
        parsed.repeat = "weekdays";
      });
      consume(/(?<![\p{L}\p{N}_])(каждую\s+неделю|еженедельно)(?![\p{L}\p{N}_])/giu, () => {
        parsed.repeat = "weekly";
      });
      consume(/(?<![\p{L}\p{N}_])(каждый\s+месяц|ежемесячно)(?![\p{L}\p{N}_])/giu, () => {
        parsed.repeat = "monthly";
      });
      consume(/(?<![\p{L}\p{N}_])каждые\s+(\d{1,3})\s*(дней|дня|день)(?![\p{L}\p{N}_])/giu, (match, amount) => {
        parsed.repeat = "interval";
        parsed.repeatIntervalDays = normalizeRepeatIntervalDays(amount);
      });

      consume(/(?<![\p{L}\p{N}_])через\s+(\d{1,2})\s*(часов|часа|час)(?![\p{L}\p{N}_])/giu, (match, amount) => {
        const dueDate = new Date();
        dueDate.setHours(dueDate.getHours() + Number(amount), dueDate.getMinutes(), 0, 0);
        parsed.due = localIsoDate(dueDate);
        parsed.time = `${String(dueDate.getHours()).padStart(2, "0")}:${String(dueDate.getMinutes()).padStart(2, "0")}`;
      });
      consume(/(?<![\p{L}\p{N}_])через\s+(\d{1,2})\s*(дней|дня|день)(?![\p{L}\p{N}_])/giu, (match, amount) => {
        parsed.due = localIsoDate(addDays(new Date(), Number(amount)));
      });
      consume(/(?<![\p{L}\p{N}_])послезавтра(?![\p{L}\p{N}_])/giu, () => {
        parsed.due = localIsoDate(addDays(new Date(), 2));
      });
      consume(/(?<![\p{L}\p{N}_])завтра(?![\p{L}\p{N}_])/giu, () => {
        parsed.due = localIsoDate(addDays(new Date(), 1));
      });
      consume(/(?<![\p{L}\p{N}_])сегодня(?![\p{L}\p{N}_])/giu, () => {
        parsed.due = localIsoDate();
      });
      consume(/(?<!\d)(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?(?!\d)/giu, (match, day, month, year) => {
        const now = new Date();
        const fullYear = year
          ? Number(String(year).length === 2 ? `20${year}` : year)
          : now.getFullYear();
        const date = new Date(fullYear, Number(month) - 1, Number(day));
        if (!Number.isNaN(date.getTime())) {
          parsed.due = localIsoDate(date);
        }
      });
      consume(/(?<!\d)(?:в\s*)?(\d{1,2})[:.](\d{2})(?!\d)/giu, (match, hours, minutes) => {
        const h = Number(hours);
        const m = Number(minutes);
        if (h <= 23 && m <= 59) {
          parsed.time = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
          if (!parsed.due) parsed.due = localIsoDate();
        }
      });
      consume(/(?<![\p{L}\p{N}_])в\s+(\d{1,2})\s*(часов|часа|час)?(?![\p{L}\p{N}_])/giu, (match, hours) => {
        const h = Number(hours);
        if (h <= 23) {
          parsed.time = `${String(h).padStart(2, "0")}:00`;
          if (!parsed.due) parsed.due = localIsoDate();
        }
      });

      if (normalizeRepeat(parsed.repeat) !== "none" && !parsed.due) {
        parsed.due = localIsoDate();
      }
      parsed.text = text.replace(/\s+/g, " ").trim() || (rawText || "").trim();
      parsed.dueAtUtc = dueAtUtc(parsed.due, parsed.time);
      return parsed;
    }

    function renderQuickPreview() {
      const parsed = parseQuickTask(quickInput.value);
      quickPreview.innerHTML = "";
      if (!quickInput.value.trim()) {
        quickPreview.classList.remove("active");
        return;
      }

      const summary = document.createElement("span");
      summary.className = "quick-preview-text";
      summary.textContent = parsed.text;
      quickPreview.appendChild(summary);

      const chips = [
        typeLabel(parsed.type),
        priorityLabel(parsed.priority),
        parsed.due ? dueLabel(parsed.due, parsed.time) : "",
        repeatLabel(parsed.repeat, parsed.repeatIntervalDays)
      ].filter(Boolean);

      for (const chipText of chips) {

        chip.className = "quick-preview-chip";
        chip.textContent = chipText;
        quickPreview.appendChild(chip);
      }
      quickPreview.classList.add("active");

    function renderCalendar() {
      const hasDue = Boolean(fields.due.value);
      const selectedIso = hasDue ? fields.due.value : localIsoDate();
      const selectedDate = dateFromIso(selectedIso) || new Date();
      const view = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth(), 1);
      const monthNames = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
      monthLabel.textContent = `${monthNames[view.getMonth()]} ${view.getFullYear()} г.`;
      document.querySelector("#todayBtn").textContent = hasDue ? shortDateText(selectedIso) : "Без срока";
      calendarGrid.innerHTML = "";
      const mondayOffset = (view.getDay() + 6) % 7;
      const firstCell = addDays(view, -mondayOffset);
      for (let i = 0; i < 42; i += 1) {
        const date = addDays(firstCell, i);
        const iso = localIsoDate(date);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "calendar-day";
        if (date.getMonth() !== view.getMonth()) button.classList.add("muted");
        if (date.getDay() === 0) button.classList.add("sunday");
        if (hasDue && iso === selectedIso) button.classList.add("selected");
        button.textContent = String(date.getDate());
        button.addEventListener("click", () => setSelectedDate(date));
        calendarGrid.appendChild(button);
      }
    }

    function setSelectedDate(date) {
      fields.due.value = localIsoDate(date);
      calendarViewDate = new Date(date.getFullYear(), date.getMonth(), 1);
      renderCalendar();
    }

    function clearDueDate() {
      fields.due.value = "";
      fields.time.value = "";
      syncChoiceField("repeat", "none");
      fields.repeatIntervalDays.value = "";
      allDayToggle.checked = false;
      fields.time.disabled = false;
      updateTimeButton();
      renderCalendar();

    function isEditableElement(element) {
      return Boolean(element?.closest?.("input, textarea, select, [contenteditable='true']"));
    }

    function dismissKeyboardOnOutsideTap(event) {
      const active = document.activeElement;
      if (!isEditableElement(active) || isEditableElement(event.target)) return;
      active.blur();
    }

    function syncViewportState() {
      const viewport = window.visualViewport;
      const height = Math.round(viewport?.height || window.innerHeight || 0);
      if (height > 0) {
        document.documentElement.style.setProperty("--vvh", `${height}px`);
      }
      const keyboardGap = Math.max(0, Math.round(window.innerHeight - (viewport?.height || window.innerHeight)));
      const keyboardOpen = keyboardGap > 140;
      document.body.classList.toggle("keyboard-open", keyboardOpen);
      if (keyboardOpen) {
        const active = document.activeElement;
        if (isEditableElement(active)) {
          window.setTimeout(() => {
            active?.scrollIntoView?.({ block: "center", behavior: "smooth" });
          }, 60);
        }
      }
    }

      targetDialog.addEventListener("click", event => {
        if (event.target === targetDialog) targetDialog.close();
      });
    }

    function collapseSearchIfEmpty() {
      if (!searchInput.value.trim()) {
        searchWrap.classList.remove("active");
      }
    }

    function syncChoiceField(name, value) {
      const input = fields[name];
      if (!input) return;
      input.value = value;
      document.querySelectorAll(`[data-choice-field="${name}"] .choice-btn`).forEach(btn => {
        btn.classList.toggle("active", btn.dataset.choiceValue === value);
      });

        fields.repeatIntervalDays.style.display = value === "interval" ? "block" : "none";
        if (value !== "interval") fields.repeatIntervalDays.value = "";
      }
    }

    function normalizeProject(project) {
      if (project === "Работа" || project === "Жизнь" || project === "Напоминалка") {
        return project;
      }
      return "Напоминалка";
    }

    function dueClass(task) {
      if (!task.due) return "";
      if (isOverdue(task)) return "overdue";
      if (task.due === todayIso()) return "today";
      return "";
    }

    function dueDateTime(task) {
      if (!task.due) return null;
      const time = task.time || "23:59";
      const date = new Date(`${task.due}T${time}:00`);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function isOverdue(task) {
      if (!task.due || task.done) return false;
      const dueAt = dueDateTime(task);
      return dueAt ? dueAt < new Date() : task.due < todayIso();
    }

    function isTodayTask(task) {
      return !task.done && (task.due === todayIso() || isOverdue(task));
    }

    function isInboxTask(task) {
      return !task.done && !task.due;
    }

    function isUpcomingTask(task) {
      return !task.done && task.due > todayIso();
    }

    function todayTimeSection(task) {
      if (!task.time) return "Без времени";
      const hour = Number((task.time || "").split(":")[0]);
      if (!Number.isFinite(hour)) return "Без времени";
      if (hour < 12) return "Утро";
      if (hour < 18) return "День";
      return "Вечер";
    }

    function visibleTasks() {
      const q = searchInput.value.trim().toLowerCase();
      return tasks
        .filter(task => {
          if (currentFilter === "today") return isTodayTask(task);
          if (currentFilter === "inbox") return isInboxTask(task);
          if (currentFilter === "upcoming") return isUpcomingTask(task);
          if (currentFilter === "done") return task.done;
          return true;
        })
        .filter(task => !q || [task.text, task.project, task.type].join(" ").toLowerCase().includes(q))
        .sort((a, b) => {
          if (a.done !== b.done) return a.done ? 1 : -1;
          if (currentFilter === "today") {
            const ao = isOverdue(a);
            const bo = isOverdue(b);
            if (ao !== bo) return ao ? -1 : 1;
            if (a.time && !b.time) return -1;
            if (!a.time && b.time) return 1;
          }
          const ad = a.dueAtUtc || `${a.due || "9999"} ${a.time || "23:59"}`;
          const bd = b.dueAtUtc || `${b.due || "9999"} ${b.time || "23:59"}`;
          if (ad !== bd) return ad.localeCompare(bd);
          const order = { high: 0, medium: 1, low: 2 };
          return (order[a.priority] ?? 1) - (order[b.priority] ?? 1);
        });
    }

    async function saveTaskChange(task) {
      task.updatedAt = new Date().toISOString();
      task.repeat = normalizeRepeat(task.repeat);
      task.repeatIntervalDays = task.repeat === "interval" ? normalizeRepeatIntervalDays(task.repeatIntervalDays) : null;
      task.repeatAnchorDay = task.repeat === "monthly" ? normalizeRepeatAnchorDay(task.repeatAnchorDay, task.due) : null;
      await scheduleLocalNotification(task);
      await updateTask(task);
      render();
    }

    async function completeTask(task) {
      if (normalizeRepeat(task.repeat) !== "none") {
        const nextDue = nextRepeatDue(task);
        if (nextDue) {
          task.due = nextDue;
          task.dueAtUtc = dueAtUtc(task.due, task.time);
          task.notifiedAt = "";
          task.done = false;
          task.updatedAt = new Date().toISOString();
          await scheduleLocalNotification(task);
          await updateTask(task);
          render();
          return;
        }
      }

      task.done = !task.done;
      task.updatedAt = new Date().toISOString();
      if (task.done) {
        await cancelLocalNotification(task);
      } else {
        task.notifiedAt = "";
        await scheduleLocalNotification(task);
      }
      await updateTask(task);
      render();
    }

    async function snoozeTask(task, nextDate, nextTime) {
      task.due = localIsoDate(nextDate);
      task.time = normalizedTime(nextTime) || localTime(nextDate);
      task.dueAtUtc = dueAtUtc(task.due, task.time);
      task.notifiedAt = "";
      task.done = false;
      await saveTaskChange(task);
    }

    function openChoiceSheet(id, field) {
      actionTaskId = id;
      actionSheetParentId = id;
      const currentTask = tasks.find(item => item.id === id);
      if (!currentTask) return;
      sheetActions.innerHTML = "";
      setActionDialogMode("quick");
      const isPriority = field === "priority";
      setActionHeader(currentTask.text || "Задача", isPriority ? "Важность" : "Тип");
      sheetActions.classList.add("compact");
      if (field === "repeat") {
        setActionHeader(currentTask.text || "Задача", "Повтор");
        if (!currentTask.due) {
          document.querySelector("#actionMeta").textContent = "Сначала выберите дату";
        }
      }
      updateSheetBack();
      const options = field === "repeat"
        ? currentTask.due
          ? [["none", "Нет"], ["daily", "Каждый день"], ["weekdays", "Будни"], ["weekly", "Неделя"], ["monthly", "Месяц"], ["interval:2", "2 дня"], ["interval:3", "3 дня"], ["interval:7", "7 дней"]]
          : [["none", "Нет"]]
        : isPriority
        ? [["high", "Важно"], ["medium", "Средне"], ["low", "Низко"]]
        : [["task", "Задача"], ["reminder", "Напоминание"]];
      options.forEach(([value, label]) => {
        const currentValue = field === "repeat" && normalizeRepeat(currentTask.repeat) === "interval"
          ? `interval:${normalizeRepeatIntervalDays(currentTask.repeatIntervalDays)}`
          : field === "repeat"
          ? normalizeRepeat(currentTask.repeat)
          : currentTask[field];
        addSheetButton(label, currentValue === value ? "primary" : "ghost", async () => {
          const selected = actionTask();
          if (!selected) return;
          if (field === "repeat") {
            const intervalMatch = value.match(/^interval:(\d{1,3})$/);
            selected.repeat = intervalMatch ? "interval" : value;
            selected.repeatIntervalDays = intervalMatch ? normalizeRepeatIntervalDays(intervalMatch[1]) : null;
            selected.repeatAnchorDay = value === "monthly"
              ? normalizeRepeatAnchorDay(selected.repeatAnchorDay, selected.due)
              : null;
          } else {
            selected[field] = value;
          }
          actionDialog.close();
          await saveTaskChange(selected);
        });
      });
      showActionDialog();
    }

    async function refreshStatus() {
      document.querySelector("#timezoneStatus").textContent =
        `${browserTimeZone()}, UTC${formatOffset(-new Date().getTimezoneOffset())}`;
      try {
        const res = await fetch(statusUrl, { cache: "no-store" });

        const status = await res.json();
        document.querySelector("#telegramStatus").textContent =
          status.telegramToken && status.chatId ? "подключен" : "не настроен";
        document.querySelector("#serverTaskCount").textContent = String(status.tasks ?? tasks.length);
      } catch {
        document.querySelector("#telegramStatus").textContent = "сервер недоступен";
        document.querySelector("#serverTaskCount").textContent = "нет связи";
      }
    }

    function formatOffset(minutes) {
      const sign = minutes >= 0 ? "+" : "-";
      const abs = Math.abs(minutes);
      const hours = String(Math.floor(abs / 60)).padStart(2, "0");
      const mins = String(abs % 60).padStart(2, "0");
      return `${sign}${hours}:${mins}`;
    }

    function exportTasks() {
      const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `tasks-${localIsoDate()}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
      setSettingsMessage("Экспорт готов");
    }

    async function importTasks(file) {
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data)) throw new Error("expected array");
        tasks = data.map(normalizeTaskTime);
        await persistAll();
        render();
        await refreshStatus();
        setSettingsMessage(`Импортировано: ${tasks.length}`);
      } catch {
        setSettingsMessage("Не удалось импортировать JSON");
      }
    }

    async function testTelegram() {
      setSettingsMessage("Отправляю тест");
      try {
        const res = await fetch(testReminderUrl, { method: "POST" });
        const data = await res.json();
        setSettingsMessage(data.ok ? "Тест отправлен" : "Тест не отправлен");
        await refreshStatus();
      } catch {
        setSettingsMessage("Сервер недоступен");
      }
    }

    function render() {
      renderStats();
      updateSelectionUi();
      const rows = visibleTasks();
      list.innerHTML = "";
      if (!rows.length) {
        list.innerHTML = `<div class="empty">${emptyText()}</div>`;
        return;
      }

      let lastGroup = "";
      for (const task of rows) {
        const currentGroup = groupLabel(task);
        if (currentGroup && currentGroup !== lastGroup) {
          appendGroupHeading(currentGroup);
          lastGroup = currentGroup;
        }
        const el = document.createElement("article");
        el.className = `task priority-${task.priority || "medium"}${task.done ? " done" : ""}${selectionMode ? " selecting" : ""}${selectedTaskIds.has(task.id) ? " selected" : ""}`;
        const dc = dueClass(task);
        const typeMeta = task.type && task.type !== "task"
          ? `<span class="meta-tag type-tag">${typeLabel(task.type)}</span>`
          : "";
        const priorityMeta = task.priority && task.priority !== "medium"
          ? `<span class="meta-tag priority-${task.priority}">${priorityLabel(task.priority)}</span>`
          : "";
        const dueMeta = task.due
          ? `<button class="meta-link meta-chip ${dc}" data-attr="due" type="button">${dueLabel(task.due, task.time)}</button>`
          : `<button class="meta-link meta-chip no-due" data-attr="due" type="button">без срока</button>`;
        const repeatMeta = repeatLabel(task.repeat, task.repeatIntervalDays)
          ? `<button class="meta-link meta-chip" data-attr="repeat" type="button">${repeatLabel(task.repeat, task.repeatIntervalDays)}</button>`
          : "";
        const meta = [dueMeta, repeatMeta, typeMeta, priorityMeta].filter(Boolean).join(`<span class="meta-separator">·</span>`);
        el.innerHTML = `
          <button class="check" aria-label="Готово">${task.done ? "✓" : ""}</button>
          <div class="task-main">
            <div class="title"></div>
            <div class="meta">${meta}</div>
          </div>
          <div class="menu">
            <button class="mini edit" aria-label="Действия">⋯</button>
          </div>
        `;
        el.querySelector(".title").textContent = task.text;
        el.addEventListener("pointerdown", event => {
          if (event.target.closest("button")) return;
          longPressTimer = window.setTimeout(() => {
            suppressNextTaskClick = true;
            toggleTaskSelection(task.id);
            render();
          }, 550);
        });
        el.addEventListener("pointerup", () => window.clearTimeout(longPressTimer));
        el.addEventListener("pointerleave", () => window.clearTimeout(longPressTimer));
        el.addEventListener("pointercancel", () => window.clearTimeout(longPressTimer));
        el.addEventListener("click", event => {
          if (suppressNextTaskClick) {
            suppressNextTaskClick = false;
            event.preventDefault();
            return;
          }
          if (event.target.closest("button")) return;
          event.preventDefault();
          if (selectionMode) {
            toggleTaskSelection(task.id);
            render();
            return;
          }
          openTaskActionsSheet(task.id);
        });
        el.addEventListener("contextmenu", event => event.preventDefault());
        el.querySelector(".check").addEventListener("click", async () => {
          if (selectionMode) {
            toggleTaskSelection(task.id);
            render();
            return;
          }
          await completeTask(task);
        });
        el.querySelectorAll("[data-attr]").forEach(btn => {
          btn.addEventListener("click", () => {
            if (selectionMode) {
              toggleTaskSelection(task.id);
              render();
              return;
            }
            const attr = btn.dataset.attr;
            if (attr === "repeat") {
              openChoiceSheet(task.id, attr);
              return;
            }
            if (attr === "due") {
              openDialog(task.id, "schedule");
            }
          });
        });
        el.querySelector(".edit").addEventListener("click", () => {
          if (selectionMode) {
            toggleTaskSelection(task.id);
            render();
            return;
          }
          openTaskManageSheet(task.id);
        });
        list.appendChild(el);
      }
    }

        ? String(normalizeRepeatIntervalDays(task.repeatIntervalDays))
        : "";
      fields.due.value = task.due || localIsoDate();

          : null,

    });
    document.querySelector("#settingsCloseBtn").addEventListener("click", () => settingsDialog.close());
    document.querySelector("#testTelegramBtn").addEventListener("click", testTelegram);
    document.querySelector("#exportBtn").addEventListener("click", exportTasks);
    document.querySelector("#importBtn").addEventListener("click", () => document.querySelector("#importFile").click());
    document.querySelector("#importFile").addEventListener("change", event => {
      importTasks(event.target.files[0]);
      event.target.value = "";
    });

    buildTimeWheel(hourWheel, 24, setTimePickerHour);
    buildTimeWheel(minuteWheel, 60, setTimePickerMinute);
    hourWheel.addEventListener("scroll", () => {
      window.clearTimeout(hourWheel._snapTimer);
      hourWheel._snapTimer = window.setTimeout(() => snapTimeWheel(hourWheel, timePickerHour, setTimePickerHour), 90);
    });
    minuteWheel.addEventListener("scroll", () => {
      window.clearTimeout(minuteWheel._snapTimer);
      minuteWheel._snapTimer = window.setTimeout(() => snapTimeWheel(minuteWheel, timePickerMinute, setTimePickerMinute), 90);
    });
    bindBackdropDismiss(dialog);
    bindBackdropDismiss(actionDialog);
    bindBackdropDismiss(settingsDialog);
    bindBackdropDismiss(timePickerDialog);
    syncViewportState();
    updateTimeButton();
    window.visualViewport?.addEventListener("resize", syncViewportState);
    window.visualViewport?.addEventListener("scroll", syncViewportState);
    window.addEventListener("resize", syncViewportState);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    load();
  </script>
</body>
</html>
